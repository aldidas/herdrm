name: MacHerdr
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  developmentRegion: en
  knownRegions:
    - en
    - zh-Hans
packages:
  HerdrKit:
    path: Packages/HerdrKit
  HerdrTailcat:
    path: Packages/HerdrTailcat
  GhosttyTerminal:
    url: https://github.com/Lakr233/libghostty-spm
    # Prebuilt libghostty xcframework — pin exactly and review the checksum diff
    # on every bump (supply-chain discipline for a binary dependency). The
    # version scheme is <major.minor>.<UTC yyyymmdd>, so `from:` would drift.
    exactVersion: "1.6.20260909"
  StickySectionHeaders:
    # Sidebar section headers (pin + cover + scroll-linked fade). Pinned to a
    # release tag; bump deliberately.
    url: https://github.com/jt-wang/StickySectionHeaders
    exactVersion: "1.0.0"
targets:
  MacHerdr:
    type: application
    platform: macOS
    sources:
      - Sources/MacHerdr
      - path: Resources
        buildPhase: resources
        excludes:
          - Localizable.xcstrings
      - path: Resources/Localizable.xcstrings
    dependencies:
      - package: HerdrKit
      - package: HerdrTailcat
        product: HerdrTailcat
      - package: GhosttyTerminal
        product: GhosttyTerminal
      - package: GhosttyTerminal
        product: GhosttyTheme
      - package: StickySectionHeaders
    info:
      path: Sources/MacHerdr/Info.plist
      properties:
        CFBundleName: MacHerdr
        CFBundleDisplayName: MacHerdr
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - zh-Hans
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm
        PRODUCT_NAME: MacHerdr
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        Debug:
          # real identity so UserNotifications & friends work in dev builds
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"

  MacHerdrTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacHerdrTests
    dependencies:
      - target: MacHerdr
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm.tests
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MacHerdr.app/Contents/MacOS/MacHerdr"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"

schemes:
  MacHerdr:
    build:
      targets:
        MacHerdr: all
        MacHerdrTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MacHerdrTests
